name: humanpulse

services:
  db:
    image: pgvector/pgvector:pg17
    # 长事务（空闲在事务里）会拖住别人的行锁；分块提交后事务都很短，超过 2 分钟视为异常
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=120s"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-humanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humanpulse}
      POSTGRES_DB: ${POSTGRES_DB:-humanpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-humanpulse} -d ${POSTGRES_DB:-humanpulse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-humanpulse}:${POSTGRES_PASSWORD:-humanpulse}@db:5432/${POSTGRES_DB:-humanpulse}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # 判官服务跑在宿主机（make laya-serve）；容器内经 host.docker.internal 访问
      JUDGEMENT_BASE_URL: http://host.docker.internal:8077
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-humanpulse}:${POSTGRES_PASSWORD:-humanpulse}@db:5432/${POSTGRES_DB:-humanpulse}
      # 判官服务跑在宿主机（make laya-serve）；容器内经 host.docker.internal 访问
      JUDGEMENT_BASE_URL: http://host.docker.internal:8077
    command: ["python", "-m", "app.workers.scheduler"]
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    profiles: ["web"]
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm --filter @humanpulse/web run dev --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
