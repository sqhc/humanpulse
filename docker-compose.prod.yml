name: humanpulse

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-humanpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-humanpulse}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/sqhc/humanpulse-api:${TAG:-latest}
    env_file:
      - .env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-humanpulse}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: ghcr.io/sqhc/humanpulse-api:${TAG:-latest}
    env_file:
      - .env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-humanpulse}
    command: ["python", "-m", "app.workers.scheduler"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/sqhc/humanpulse-web:${TAG:-latest}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
