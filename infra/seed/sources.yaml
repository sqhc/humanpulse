  #   enabled: false
  #   license: 实例公开 API

# 明确不接入（政策原因）：
# - X / Twitter：2025 起按量付费 API，未授权抓取有条款与法律风险；不在路线图内。
# - 任何需要绕过 Cloudflare / 登录墙 / 反爬机制的抓取。
