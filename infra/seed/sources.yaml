# humanpulse 初始数据源清单
# 由 `make seed` 导入（按 name upsert；加 --prune 会把清单外的源停用）。
#
# 2026-09 逐个 curl 实测（结论见 docs/data-sources.md）：
#   * 可用：下面 rss / gdelt 条目
#   * 已移除：Reuters（feed 404）、AP（403）、澎湃（rss 404）、
#     新华网 rss（返回 200 但是 2022 年的静态 XML，且无 pubDate——靠 max_item_age_days 也拦不住）
#   * 需注册：ReliefWeb v2 要求 approved appname、ACLED 限非商业 → 默认关闭
#   * 无采集器：UCDP → 默认关闭，等实现 collector 再启用

defaults:
  cadence_minutes: 60
  enabled: true

sources:
  # ---- 通讯社 / 国际新闻（RSS/Atom，公开） ----
  - name: Al Jazeera
    kind: rss
    url: https://www.aljazeera.com/xml/rss/all.xml
    tier: 1
    cadence_minutes: 30
    license: 仅存元数据与短引用，附原文链接
  - name: BBC World
    kind: rss
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    tier: 1
    cadence_minutes: 30
    license: 仅存元数据与短引用，附原文链接
  - name: France 24
    kind: rss
    url: https://www.france24.com/en/rss
    tier: 1
    cadence_minutes: 30
    license: 仅存元数据与短引用，附原文链接
  - name: UN News
    kind: rss
    url: https://news.un.org/feed/subscribe/en/news/all/rss.xml
    tier: 1
    cadence_minutes: 60
    license: 联合国公开新闻源，署名使用
  - name: NPR World
    kind: rss
    url: https://feeds.npr.org/1004/rss.xml
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: The Guardian World
    kind: rss
    url: https://www.theguardian.com/world/rss
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: DW Top Stories
    kind: rss
    url: https://rss.dw.com/rdf/rss-en-top
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接

  # ---- 中文源 ----
  - name: BBC 中文
    kind: rss
    url: https://feeds.bbci.co.uk/zhongwen/simp/rss.xml
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: 纽约时报中文网
    kind: rss
    url: https://cn.nytimes.com/rss/
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: RFI 中文
    kind: rss
    url: https://www.rfi.fr/cn/rss
    tier: 3
    cadence_minutes: 120
    license: 仅存元数据与短引用，附原文链接
  - name: RFA 中文
    kind: rss
    url: https://www.rfa.org/mandarin/rss2.xml
    tier: 3
    cadence_minutes: 120
    license: 仅存元数据与短引用，附原文链接
  # 以下中文源为 2026-09 逐个 curl + 真实客户端（httpx + feedparser）实测后追加，
  # 判定标准：200 且可解析、最新一条发布时间在 7 天内。证据见 docs/data-sources.md。
  - name: 中央社 国际焦点
    kind: rss
    url: https://feeds.feedburner.com/rsscna/intworld
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: 公视新闻
    kind: rss
    url: https://news.pts.org.tw/xml/newsfeed.xml
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: 端传媒
    kind: rss
    url: https://theinitium.com/rss/
    tier: 2
    cadence_minutes: 120
    license: 仅存元数据与短引用，附原文链接
  - name: 德国之声中文
    kind: rss
    url: https://rss.dw.com/rdf/rss-chi-all
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: 美国之音中文
    kind: rss
    url: https://www.voachinese.com/api/zm_yql-vomx-tpeybti
    tier: 2
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: 中国数字时代
    kind: rss
    url: https://chinadigitaltimes.net/chinese/feed
    tier: 2
    cadence_minutes: 120
    license: 仅存元数据与短引用，附原文链接
  - name: 中国新闻网
    kind: rss
    url: https://www.chinanews.com.cn/rss/scroll-news.xml
    tier: 3
    cadence_minutes: 60
    license: 仅存元数据与短引用，附原文链接
  - name: 界面新闻
    kind: rss
    url: "https://a.jiemian.com/index.php?m=article&a=rss"
    tier: 3
    cadence_minutes: 120
    license: 仅存元数据与短引用，附原文链接

  # ---- 冲突 / 人道 / 人权（议题专用） ----
  - name: Crisis Group
    kind: rss
    url: https://www.crisisgroup.org/rss.xml
    tier: 1
    cadence_minutes: 180
    license: 仅存元数据与短引用，附原文链接
  # Amnesty 的 RSS 走 Cloudflare：curl 能拿到 200，但 Python httpx 客户端稳定 403
  # （TLS 指纹被判定为非浏览器）。按 ADR-0002 不做事反爬绕过，因此停用。
  - name: Amnesty International
    kind: rss
    url: https://www.amnesty.org/en/rss/
    tier: 2
    enabled: false
    cadence_minutes: 240
    license: 仅存元数据与短引用，附原文链接；Cloudflare 会拒绝非浏览器客户端

  # ---- 科技 / 科学 ----
  - name: Ars Technica
    kind: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    tier: 1
    cadence_minutes: 120
    license: 仅存元数据与短引用，附原文链接
  - name: Nature
    kind: rss
    url: https://www.nature.com/nature.rss
    tier: 1
    cadence_minutes: 360
    license: 仅存元数据与短引用，附原文链接
  - name: Science News
    kind: rss
    url: https://www.science.org/rss/news_current.xml
    tier: 2
    cadence_minutes: 360
    license: 仅存元数据与短引用，附原文链接
  - name: MIT Technology Review
    kind: rss
    url: https://www.technologyreview.com/feed/
    tier: 2
    cadence_minutes: 240
    license: 仅存元数据与短引用，附原文链接
  - name: Rest of World
    kind: rss
    url: https://restofworld.org/feed/latest/
    tier: 2
    cadence_minutes: 240
    license: 仅存元数据与短引用，附原文链接

  # ---- 开发者社区（低权重） ----
  - name: Hacker News (front page)
    kind: rss
    url: https://hnrss.org/frontpage
    tier: 3
    cadence_minutes: 120
    license: 公开聚合源

  # ---- 检索式源：GDELT（官方建议请求间隔 >= 5 秒） ----
  - name: GDELT 冲突与抗议
    kind: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    tier: 1
    cadence_minutes: 60
    throttle_seconds: 12
    params:
      mode: artlist
      format: json
      maxrecords: 25
      timespan: 24h
      query: '(conflict OR ceasefire OR airstrike OR protest OR crackdown) sourcelang:english'
    license: GDELT 公开数据，引用 GDELT Project
  - name: GDELT 科技与科学
    kind: gdelt
    url: https://api.gdeltproject.org/api/v2/doc/doc
    tier: 2
    cadence_minutes: 120
    throttle_seconds: 12
    params:
      mode: artlist
      format: json
      maxrecords: 40
      timespan: 24h
      query: '(breakthrough OR "research team" OR semiconductor OR "fusion energy") sourcelang:english'
    license: GDELT 公开数据，引用 GDELT Project

  # ---- 需要注册或尚无采集器：默认关闭 ----
  # ReliefWeb v2 要求 approved appname（申请：https://apidoc.reliefweb.int/parameters#appname）；
  # 获批后把 enabled 改成 true，并实现 kind=reliefweb 的 collector。
  - name: ReliefWeb (OCHA)
    kind: reliefweb
    url: https://api.reliefweb.int/v2/reports
    tier: 1
    enabled: false
    license: OCHA 公开 API，需 approved appname 后署名使用
  # UCDP 免费但尚未实现 collector，先停用。
  - name: UCDP Georeferenced Events
    kind: ucdp
    url: https://ucdpapi.pcr.uu.se/api/gedevents/24.1
    tier: 2
    enabled: false
    license: UCDP 公开数据，署名使用
  # ACLED 需要申请 API key，且许可仅限非商业/研究用途。
  - name: ACLED
    kind: acled
    url: https://api.acleddata.com/acled/read
    tier: 3
    enabled: false
    license: 非商业/研究用途，需申请 API key

  # ---- 明确不接入 ----
  # X / Twitter：2025 起按量付费 API，未授权抓取有条款与法律风险；不在路线图内。
  # 任何需要绕过 Cloudflare / 登录墙 / 反爬机制的抓取。
